services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: puffx
      POSTGRES_USER: puffx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-puffx_dev_password}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puffx -d puffx"]
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    image: puffxhost/puffx-whatsapp-gateway:latest
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://puffx:${POSTGRES_PASSWORD:-puffx_dev_password}@db:5432/puffx
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?Set API_KEY_PEPPER in .env}
      WHATSAPP_AUTH_DIR: /var/lib/puffx/whatsapp
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes: ["whatsapp_data:/var/lib/puffx/whatsapp"]
    ports: ["127.0.0.1:3000:3000"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
  whatsapp_data:

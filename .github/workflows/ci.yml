name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          {
            POSTGRES_USER: puffx,
            POSTGRES_PASSWORD: puffx_test_password,
            POSTGRES_DB: puffx,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U puffx -d puffx"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm install
      - run: npm --prefix apps/dashboard install
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Database integration checks
        run: npm run db:migrate
        env:
          DATABASE_URL: postgres://puffx:puffx_test_password@localhost:5432/puffx

